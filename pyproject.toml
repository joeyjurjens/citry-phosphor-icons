[project]
name = "citry-phosphor-icons"
version = "0.1.0"
description = "Phosphor Icons as citry components"
readme = "README.md"
authors = [
    { name = "Joey Jurjens", email = "joeyjurjens@gmail.com" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
keywords = ["citry", "components", "phosphor", "icons"]
dependencies = [
    "citry>=0.5.0",
    "py-phosphor-icons>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/citry_phosphor_icons"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "citry[ext-preview]",
    "pytest>=8",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
